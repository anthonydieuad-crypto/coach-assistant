<div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-white/10 animate-fade-in">
        <h1 class="text-3xl font-bold text-amber-500 mb-2 text-center">Créer mon Club</h1>
        <p class="text-gray-400 text-center mb-6 text-sm">Configurez votre espace de travail pour commencer</p>

        <form (submit)="$event.preventDefault(); creerMonClub()" class="space-y-4">
            
            <div>
                <label class="text-gray-300 text-sm font-bold block mb-1">Nom du club ou de l'équipe</label>
                <input type="text" [ngModel]="nomClub()" (ngModelChange)="nomClub.set($event)" name="nomClub"
                       class="w-full bg-slate-700 text-white rounded-lg p-3 border border-slate-600 focus:border-amber-500 outline-none transition-colors" placeholder="Ex: FC Barcelone Team Zidane...">
            </div>

            @if (erreur()) {
                <div class="bg-rose-500/10 border border-rose-500/50 rounded-lg p-3">
                    <p class="text-rose-500 text-sm text-center font-bold">{{ erreur() }}</p>
                </div>
            }

            <button type="submit"
                    [disabled]="isLoading()"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg transition-colors shadow-lg mt-6 flex items-center justify-center">

                @if (isLoading()) {
                    <span class="spinner"></span> Création en cours...
                } @else {
                    Créer mon espace
                }
            </button>
        </form>
    </div>
</div>
