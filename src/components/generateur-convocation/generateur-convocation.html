<div class="bg-slate-800 rounded-lg shadow-xl p-6 text-gray-200 mt-4 border border-slate-700">
  <h3 class="text-xl font-bold text-orange-500 mb-4 flex items-center">
    <span class="mr-2">💬</span> Générateur WhatsApp
  </h3>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
    <div class="space-y-3">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Type d'événement</label>
        <select [(ngModel)]="typeEvenement" (change)="genererMessage()" class="w-full bg-slate-700 rounded p-2 border border-slate-600 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none">
          <option value="plateau">Plateau</option>
          <option value="match">Match</option>
          <option value="tournoi">Tournoi</option>
          <option value="entraînement">Entraînement</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm text-gray-400 mb-1">Adversaire / Lieu du match</label>
        <input type="text" [(ngModel)]="lieuEvenement" (keyup)="genererMessage()" placeholder="Ex: Montrottier" class="w-full bg-slate-700 rounded p-2 border border-slate-600 outline-none">
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Lieu de RDV précis</label>
        <input type="text" [(ngModel)]="lieuRdv" (keyup)="genererMessage()" placeholder="Ex: Parking du stade..." class="w-full bg-slate-700 rounded p-2 border border-slate-600 outline-none">
      </div>

      <div>
        <label class="block text-sm text-gray-400 mb-1">Heure de RDV</label>
        <input type="time" [(ngModel)]="heureRdv" (change)="genererMessage()" class="w-full bg-slate-700 rounded p-2 border border-slate-600 outline-none">
      </div>
    </div>

    <div class="bg-slate-700 rounded p-4 border border-slate-600 h-64 overflow-y-auto">
      <label class="block text-sm text-gray-400 mb-2 font-bold">Sélectionner les convoqués :</label>
      
      <div class="space-y-2">
        <label *ngFor="let joueur of joueurs()" class="flex items-center space-x-3 cursor-pointer p-1 hover:bg-slate-600 rounded">
  <input type="checkbox" 
         (change)="toggleJoueur(joueur.nom + ' ' + joueur.prenom)" 
         class="form-checkbox h-5 w-5 text-orange-500 rounded border-slate-500 bg-slate-800 focus:ring-orange-500">
  <span>{{ joueur.nom }} {{ joueur.prenom }}</span>
</label>
        
        <div *ngIf="joueurs().length === 0" class="text-gray-400 italic text-sm">
          Aucun joueur trouvé pour cette équipe.
        </div>
      </div>
    </div>
  </div>

  <div class="bg-[#128C7E] rounded-lg p-4 mb-4 relative shadow-inner">
    <p class="whitespace-pre-wrap font-sans text-sm text-white">{{ messageGenere }}</p>
  </div>

  <button (click)="copierMessage()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 px-4 rounded transition-colors flex justify-center items-center">
    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
    Copier pour WhatsApp
  </button>
</div>
