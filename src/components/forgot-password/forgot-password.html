<div class="min-h-[80vh] flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-slate-800/80 p-8 rounded-2xl shadow-2xl border border-slate-700 backdrop-blur-sm animate-fade-in-up">
        
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-white tracking-tight">Mot de passe oublié ?</h2>
            <p class="mt-2 text-sm text-gray-400">Pas de panique, on va régler ça !</p>
        </div>

        @if (!isSent()) {
            <form class="mt-8 space-y-6" (submit)="$event.preventDefault(); envoyerLien()">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Adresse e-mail</label>
                    <input id="email" type="email" [value]="email()" (input)="email.set($any($event.target).value)" required
                           class="appearance-none relative block w-full px-3 py-2 border border-slate-600 bg-slate-900/50 placeholder-gray-500 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 focus:z-10 sm:text-sm transition-colors"
                           placeholder="coach@exemple.com">
                </div>

                <button type="submit" [disabled]="isLoading() || !email()"
                        class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-amber-600 hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 disabled:bg-slate-600 disabled:cursor-not-allowed transition-colors shadow-lg">
                    @if (isLoading()) {
                        <span class="flex items-center">
                            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            Envoi en cours...
                        </span>
                    } @else {
                        Envoyer le lien
                    }
                </button>
            </form>
        } @else {
            <div class="mt-8 bg-green-500/10 border border-green-500/30 rounded-lg p-4 text-center">
                <span class="text-4xl block mb-2">📬</span>
                <p class="text-green-400 font-medium">Un email a été envoyé !</p>
                <p class="text-sm text-gray-300 mt-2">Cliquez sur le lien qu'il contient pour choisir un nouveau mot de passe.</p>
            </div>
        }

        <div class="text-center mt-6">
            <a routerLink="/login" class="font-medium text-amber-500 hover:text-amber-400 transition-colors text-sm">
                ← Retour à la connexion
            </a>
        </div>
    </div>
</div>
