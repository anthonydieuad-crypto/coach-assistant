<div class="p-4 sm:p-6 min-h-screen text-gray-100">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-white">🛡️ Dashboard Admin</h1>
        <div class="bg-slate-800 px-4 py-2 rounded-lg border border-white/10 self-start sm:self-auto">
            <span class="text-amber-500 font-bold text-xl">{{ users().length }}</span>
            <span class="text-gray-400 text-sm ml-2">Inscrits</span>
        </div>
    </div>

    <div class="bg-slate-800/50 backdrop-blur-md rounded-xl border border-white/10 overflow-hidden shadow-2xl">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                <tr class="bg-slate-900/80 text-gray-400 text-xs uppercase border-b border-white/10">
                    <th class="p-4">ID</th>
                    <th class="p-4">Nom</th>
                    <th class="p-4">Email</th>
                    <th class="p-4">Rôle</th>
                    <th class="p-4 text-right">Action</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                @for (user of users(); track user.id) {
                <tr class="hover:bg-white/5 transition-colors">
                    <td class="p-4 text-gray-500 font-mono text-xs">#{{ user.id }}</td>
                    <td class="p-4 font-bold text-white">{{ user.prenom }} {{ user.nom }}</td>
                    <td class="p-4 text-blue-400 text-sm">{{ user.email }}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold border"
                              [ngClass]="user.role === 'ADMIN' ? 'bg-purple-500/20 text-purple-400 border-purple-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'">
                            {{ user.role }}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        @if (user.role !== 'ADMIN') {
                        <button (click)="supprimerUtilisateur(user)"
                                class="text-rose-500 hover:text-white hover:bg-rose-600 px-3 py-1 rounded transition-colors border border-rose-500/20">
                            Supprimer
                        </button>
                        }
                    </td>
                </tr>
                }
                </tbody>
            </table>
        </div>
    </div>
</div>
